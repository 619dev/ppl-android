AuthorName: 619dev
WebSite: https://paperphone.app
SourceCode: https://github.com/619dev/ppl-android
IssueTracker: https://github.com/619dev/ppl-android/issues

AutoName: PaperPhoneLite

RepoType: git
Repo: https://github.com/619dev/ppl-android.git

Builds:
  - versionName: 3.0.18
    versionCode: 30018
    commit: 04214447ffa7383e5801ae3c98bb9c46d56379b3
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless -t forky nodejs npm
      - update-java-alternatives -a
    init:
      - cd ../..
      - npm ci
      - npm run build
      - npx cap sync android --deployment
    gradle:
      - yes
    output: build/outputs/apk/release/app-release-unsigned.apk
    scanignore:
      - android/build.gradle
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
